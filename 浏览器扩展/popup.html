<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>后台视频预览</title>
<style>
body{width:350px;padding:18px;margin:0;font:14px 'Microsoft YaHei UI',sans-serif;color:#20324b;background:#f6f8fc}
h1{font-size:20px;margin:0 0 10px}p{line-height:1.6;margin:10px 0}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c5d6;border-radius:6px}
button{padding:10px 12px;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#start{background:#245ac5;color:white}#repair,#stop{background:#e2e8f1;color:#243d5b}#reload{background:transparent;color:#405879;border:1px solid #b9c5d6;font-size:12px}
.buttons{display:flex;gap:8px;margin-top:12px}#status{white-space:pre-line;color:#27654f;overflow-wrap:anywhere}.small{font-size:12px;color:#5a697e}
</style><body>
<h1>后台视频预览</h1><p>先在当前标签页播放视频，再粘贴桌面工具的连接码。</p>
<input id="code" aria-label="桌面工具连接码" placeholder="从桌面工具复制连接码" autocomplete="off" spellcheck="false">
<div class="buttons"><button id="start">开始预览</button><button id="repair">修复并重连</button><button id="stop">停止</button></div>
<p id="status" role="status">等待连接</p><p class="small">开始后可以切换标签页或最小化浏览器。保留视频标签页打开。画面仅发送到本机，不保存录像。</p>
<p class="small">断线会自动重试，后台采集异常会尝试恢复原视频页，无需重新导入。若浏览器要求重新授权，回到视频页点击“修复并重连”。桌面工具重启后请更新连接码。</p>
<button id="reload">重新载入扩展</button><p class="small">仅在修复无效或更新文件后使用，会中断预览并关闭此面板。连接码会保留。Alt+Shift+H 打开面板；Alt+Shift+R 重载。</p>
<script src="core.js"></script><script src="popup.js"></script></body></html>
