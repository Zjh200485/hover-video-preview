<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>悬停预览兼容性测试</title>
<style>
body{margin:24px;background:#f3f6fa;color:#213047;font:16px 'Microsoft YaHei UI',sans-serif}
main{max-width:900px;margin:auto}h1{font-size:25px;margin-bottom:8px}p{line-height:1.6}
button{padding:12px 24px;background:#225bc4;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}
video{display:block;width:100%;background:#15283e;margin-top:18px;border-radius:10px}
#status{color:#245c47;font-weight:600}canvas{display:none}
</style>
<main><h1>悬停预览兼容性测试</h1><p>此页面在本机生成一个短视频，用于检查浏览器的实时预览。无需联网。</p>
<button id="start">生成并播放测试视频</button><p id="status">等待开始</p>
<video id="video" controls loop playsinline></video><canvas id="canvas" width="640" height="360"></canvas>
</main>
<script>
const start=document.getElementById('start'),status=document.getElementById('status');
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),video=document.getElementById('video');
let audio,frame=0,timer;
start.addEventListener('click',async()=>{
 start.disabled=true;
 try{
  status.textContent='正在本机生成测试视频（约 3 秒）…';
  audio=new AudioContext();await audio.resume();
  const output=audio.createMediaStreamDestination(),tone=audio.createOscillator(),gain=audio.createGain();
  tone.frequency.value=220;gain.gain.value=.003;tone.connect(gain);gain.connect(output);tone.start();
  function paint(){
   ctx.fillStyle=Math.floor(frame/8)%2?'#b14270':'#187fc4';ctx.fillRect(0,0,640,360);
   ctx.fillStyle='white';ctx.font='28px sans-serif';ctx.fillText('LIVE VIDEO   FRAME '+frame,25,50);
   ctx.beginPath();ctx.arc(45+(frame*11)%540,190,30,0,Math.PI*2);ctx.fill();
   ctx.font='20px sans-serif';ctx.fillText('Generated locally for preview verification',25,315);frame++;
  }
  paint();timer=setInterval(paint,33);
  const stream=canvas.captureStream(30);stream.addTrack(output.stream.getAudioTracks()[0]);
  const options=MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?{mimeType:'video/webm;codecs=vp8,opus'}:{};
  const recorder=new MediaRecorder(stream,options),chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{
   clearInterval(timer);tone.stop();stream.getTracks().forEach(track=>track.stop());await audio.close();
   video.src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));video.volume=.3;
   try{await video.play();status.textContent='播放中：测试视频有动态画面和很轻的声音。'}
   catch{status.textContent='视频已生成，请点击视频里的播放按钮。'}
  };
  recorder.start();setTimeout(()=>recorder.stop(),3200);
 }catch(error){clearInterval(timer);status.textContent='测试视频生成失败：'+error.message;start.disabled=false;}
});
</script>
</html>
